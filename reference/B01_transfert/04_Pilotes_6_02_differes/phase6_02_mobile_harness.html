<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Phase 6.02 — simulation viewport mobile 390 px</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #cbd1d1; font: 14px system-ui,sans-serif; color: #173039; padding: 18px; }
    p { max-width: 440px; margin: 0 auto 13px; }
    iframe { display: block; width: 390px; height: 844px; max-width: 100%; margin: auto; border: 0; box-shadow: 0 12px 40px #30414b46; background: white; }
  </style>
</head>
<body>
  <p>Pilote contrôlé : iframe à <strong>390 × 844 px</strong>. Il teste le responsive CSS du pilote, sans émulation d’un appareil réel.</p>
  <iframe id="view" title="Pilote dans un viewport de 390 par 844 pixels"></iframe>
  <script>
    const q = new URLSearchParams(location.search);
    const inner = new URL('./phase6_02_pilotes.html', location.href);
    inner.searchParams.set('case', q.get('case') === 'incident' ? 'incident' : 'sound');
    if (q.get('state')) inner.searchParams.set('state', q.get('state'));
    document.getElementById('view').src = inner.href;
  </script>
</body>
</html>
