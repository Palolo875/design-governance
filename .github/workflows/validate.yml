name: Validate Design Governance (dépôt de travail)

# R11 final (V12R_47) : la CI du package vit dans package/.github/workflows/, que GitHub n'exécute pas depuis ce
# dépôt de travail. Ce workflow racine lance la même validation depuis package/, sur la matrice Python visée par
# 13.01 (3.10, 3.11, 3.13), et contrôle l'intégrité de la baseline B01 (lecture seule).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.13']
    steps:
      - name: Checkout
        # Même épinglage que package/.github/workflows/validate.yml (F-WF-001)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Baseline B01 en lecture seule (218 fichiers)
        working-directory: reference/B01_transfert
        run: test "$(sha256sum -c SHA256SUMS.txt | grep -c ': OK$')" = "218"
      - name: Validation complète du package (validate_all)
        working-directory: package
        run: python3 -B scripts/validate_all.py
